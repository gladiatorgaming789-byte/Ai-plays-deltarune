[package]
name = "deltarune-runtime"
version = "0.1.0"
edition = "2021"
description = "Rust numerical observation runtime for AI Plays Deltarune"
license = "MIT"

[lib]
name = "deltarune_runtime"
path = "src/lib.rs"

[[bin]]
name = "encode-observation"
path = "src/bin/encode_observation.rs"

[dependencies]
blake2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
