name: Probe corrected CSX release bytes

on:
  workflow_dispatch:
  push:
    branches:
      - development
    paths:
      - ".github/workflows/probe-csx-release.yml"
      - "mods/tools/deltamod_csx_package_impl.py"
      - "mods/tools/deltamod_csx_loader.py"
      - "mods/speed/AiSpeed.csx"
      - "mods/speed/tools/build_packages.py"
      - "mods/telemetry/AiTelemetry.csx"
      - "mods/telemetry/tools/build_packages.py"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build deterministic candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('mods/validated_deltarune_build.json').read_text())
          Path('/tmp/clean_hashes.json').write_text(
              json.dumps(data['chapter_sha256'], indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          python -S mods/speed/tools/build_packages.py \
            --target-version 1.05 \
            --clean-hashes /tmp/clean_hashes.json \
            --output /tmp/speed.zip \
            --manifest /tmp/speed-builder.json
          python -S mods/telemetry/tools/build_packages.py \
            --target-version 1.05 \
            --clean-hashes /tmp/clean_hashes.json \
            --output /tmp/telemetry.zip \
            --manifest /tmp/telemetry-builder.json
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import zipfile
          from mods.build_validated_packages import canonicalize_zip_storage

          for label, filename in [('SPEED', '/tmp/speed.zip'), ('TELEMETRY', '/tmp/telemetry.zip')]:
              path = Path(filename)
              canonicalize_zip_storage(path)
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              with zipfile.ZipFile(path) as archive:
                  modding = archive.read('modding.xml').decode('utf-8')
                  meta = archive.read('meta.json').decode('utf-8')
              print(f'PROBE_{label}_SIZE={path.stat().st_size}')
              print(f'PROBE_{label}_SHA256={digest}')
              print(f'PROBE_{label}_MODDING_XML_BEGIN')
              print(modding, end='')
              print(f'PROBE_{label}_MODDING_XML_END')
              print(f'PROBE_{label}_META_JSON_BEGIN')
              print(meta, end='')
              print(f'PROBE_{label}_META_JSON_END')
          PY
