name: Materialize validated mod ZIPs

on:
  workflow_dispatch:
  push:
    branches:
      - development
    paths:
      - ".github/workflows/materialize-mod-zips.yml"
      - "mods/build_validated_packages.py"
      - "mods/validated_deltarune_build.json"
      - "mods/tools/**"
      - "mods/speed/AiSpeed.csx"
      - "mods/speed/tools/**"
      - "mods/speed/release_1.3.1.json"
      - "mods/telemetry/AiTelemetry.csx"
      - "mods/telemetry/tools/**"
      - "mods/telemetry/release_9.2.1.json"
      - "mods/support/**"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build and verify validated packages
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            mods/speed/deltamod/AI-Speed-All-Chapters-DeltaMod-CSX-v1.3.0.zip \
            mods/speed/deltamod/AI-Speed-All-Chapters-DeltaMod-CSX-v1.3.1.zip \
            mods/telemetry/deltamod/Telemetry-All-Chapters-DeltaMod-CSX-v9.2.0.zip \
            mods/telemetry/deltamod/Telemetry-All-Chapters-DeltaMod-CSX-v9.2.1.zip \
            mods/support/deltamod/AI-Support-All-Chapters-DeltaMod-CSX-v1.0.0.zip
          python -S mods/build_validated_packages.py

      - name: Commit exact validated ZIPs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            mods/speed/deltamod \
            mods/telemetry/deltamod \
            mods/support/deltamod
          git add -f \
            mods/speed/deltamod/AI-Speed-All-Chapters-DeltaMod-CSX-v1.3.1.zip \
            mods/telemetry/deltamod/Telemetry-All-Chapters-DeltaMod-CSX-v9.2.1.zip \
            mods/support/deltamod/AI-Support-All-Chapters-DeltaMod-CSX-v1.0.0.zip
          if git diff --cached --quiet; then
            echo "Validated package ZIPs are already committed."
            exit 0
          fi
          git commit -m "Include atomic AI Support DeltaMod ZIP"
          git push origin HEAD:development
