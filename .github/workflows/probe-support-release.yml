name: Probe atomic AI Support package

on:
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - ".github/workflows/probe-support-release.yml"
      - "mods/support/tools/build_packages.py"
      - "mods/speed/AiSpeed.csx"
      - "mods/telemetry/AiTelemetry.csx"
      - "mods/tools/deltamod_csx_package_impl.py"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and inspect atomic package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          baseline = json.loads(Path('mods/validated_deltarune_build.json').read_text())
          Path('/tmp/clean_hashes.json').write_text(json.dumps(baseline['chapter_sha256']) + '\n')
          PY
          python -S mods/support/tools/build_packages.py \
            --target-version 1.05 \
            --clean-hashes /tmp/clean_hashes.json \
            --output /tmp/support.zip \
            --manifest /tmp/support-builder.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import zipfile
          from mods.build_validated_packages import canonicalize_zip_storage

          path = Path('/tmp/support.zip')
          canonicalize_zip_storage(path)
          with zipfile.ZipFile(path) as archive:
              modding = archive.read('modding.xml').decode('utf-8')
              source = archive.read('Chapter1Support.csx').decode('utf-8')
              assert all(archive.read(f'Chapter{chapter}Support.csx').decode('utf-8') == source for chapter in range(1, 6))
          assert modding.count('type="csx"') == 5
          assert 'type="xdelta"' not in modding
          assert 'void InstallAiSpeed()' in source
          assert 'void InstallAiTelemetry()' in source
          assert source.rstrip().endswith('InstallAiTelemetry();')
          assert 'AI_SPEED_MOD|1|' in source
          assert 'DRTEL|9|' in source
          print(f'PROBE_SUPPORT_SIZE={path.stat().st_size}')
          print(f'PROBE_SUPPORT_SHA256={hashlib.sha256(path.read_bytes()).hexdigest()}')
          print(f'PROBE_SUPPORT_SOURCE_SHA256={hashlib.sha256(source.encode()).hexdigest()}')
          print('PROBE_SUPPORT_MODDING_XML_BEGIN')
          print(modding, end='')
          print('PROBE_SUPPORT_MODDING_XML_END')
          print(json.dumps(json.loads(Path('/tmp/support-builder.json').read_text()), indent=2))
          PY
